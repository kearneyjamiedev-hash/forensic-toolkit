name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "19 4 * * 1"

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Run Bandit security gate
        run: |
          bandit \
            -r app forensics \
            -x tests \
            -ll \
            -ii

      - name: Generate Bandit JSON report
        if: always()
        run: |
          bandit \
            -r app forensics \
            -x tests \
            -f json \
            -o bandit-report.json \
            --exit-zero

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "::notice::requirements.txt not found; auditing the resolved CI runtime environment."
            python -m pip install \
              fastapi \
              "uvicorn[standard]" \
              python-multipart \
              reportlab \
              pypdf \
              Pillow \
              pefile \
              olefile \
              httpx
          fi

      - name: Install pip-audit
        run: |
          python -m pip install pip-audit

      - name: Run dependency vulnerability gate
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip_audit \
              --requirement requirements.txt \
              --strict
          else
            python -m pip_audit \
              --local \
              --strict
          fi

      - name: Generate pip-audit JSON report
        if: always()
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip_audit \
              --requirement requirements.txt \
              --format json \
              --output pip-audit-report.json \
              || true
          else
            python -m pip_audit \
              --local \
              --format json \
              --output pip-audit-report.json \
              || true
          fi

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: ignore
