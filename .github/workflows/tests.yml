name: Automated forensic tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ExifTool
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl
          exiftool -ver

      - name: Configure ExifTool for Linux runner
        shell: bash
        run: |
          EXIFTOOL_BIN="$(command -v exiftool)"

          if [ -z "$EXIFTOOL_BIN" ]; then
            echo "ExifTool was not found on PATH."
            exit 1
          fi

          mkdir -p tools/exiftool

          # The application currently references the bundled Windows path:
          # tools/exiftool/exiftool.exe
          #
          # On the Ubuntu CI runner the checked-in Windows executable cannot
          # run, so replace only the CI working-copy file with a symlink to the
          # native Linux ExifTool installed above.
          rm -f tools/exiftool/exiftool.exe
          ln -s "$EXIFTOOL_BIN" tools/exiftool/exiftool.exe

          echo "CI ExifTool path:"
          ls -l tools/exiftool/exiftool.exe
          tools/exiftool/exiftool.exe -ver

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install application dependencies
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "requirements.txt not found; installing the current known runtime dependencies."
            python -m pip install \
              fastapi \
              "uvicorn[standard]" \
              python-multipart \
              reportlab \
              pypdf \
              Pillow \
              pefile \
              olefile
          fi

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q app forensics tests

      - name: Run automated test suite with coverage
        run: |
          python -m pytest \
            --cov=forensics \
            --cov-report=term-missing \
            --cov-report=xml \
            -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
