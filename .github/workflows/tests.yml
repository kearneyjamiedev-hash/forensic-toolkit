name: Automated forensic tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ExifTool
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install application dependencies
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "requirements.txt not found; installing the current known runtime dependencies."
            python -m pip install \
              fastapi \
              "uvicorn[standard]" \
              python-multipart \
              reportlab \
              pypdf \
              Pillow \
              pefile \
              olefile
          fi

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Confirm ExifTool is available
        run: |
          exiftool -ver

      - name: Compile Python sources
        run: |
          python -m compileall -q app forensics tests

      - name: Run automated test suite with coverage
        run: |
          python -m pytest \
            --cov=forensics \
            --cov-report=term-missing \
            --cov-report=xml \
            -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
